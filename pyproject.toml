[project]
name = "localdoc-ia"
version = "0.1.0"
description = "LocalDoc AI Project"
readme = "README.md"
authors = [
    { name = "Eduardo", email = "edus_55@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "python-telegram-bot>=22.8",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
localdoc-ia = "localdoc_ia.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
